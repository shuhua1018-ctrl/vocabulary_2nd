<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>單字學習中心 2.0</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">V</span><div><h1>單字學習中心</h1><p id="loadStatus">正在載入單字題庫…</p></div></div>
    <div class="top-actions">
      <button class="button button-light" id="exportBtn">匯出紀錄</button>
      <button class="button button-light" id="importBtn">匯入紀錄</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="shell">
    <section class="welcome">
      <div><p class="eyebrow">VOCABULARY WORKSPACE</p><h2>今天也往熟記單字前進一步。</h2><p class="muted">題庫從 GitHub CSV 讀取；收藏、錯題與學習進度保存在目前瀏覽器。</p></div>
      <div class="welcome-icon">✦</div>
    </section>

    <nav class="nav-grid" aria-label="主要功能">
      <button class="nav-item active" data-page="review"><span class="nav-icon blue">▤</span><span><strong>單字複習</strong><small>翻卡與間隔複習</small></span><span class="nav-arrow">›</span></button>
      <button class="nav-item" data-page="quiz"><span class="nav-icon amber">✓</span><span><strong>單字測驗</strong><small>選擇、拼字、聽力</small></span><span class="nav-arrow">›</span></button>
      <button class="nav-item" data-page="favorites"><span class="nav-icon green">♡</span><span><strong>收藏與錯題</strong><small>集中練習薄弱單字</small></span><span class="nav-arrow">›</span></button>
      <button class="nav-item" data-page="stats"><span class="nav-icon purple">▥</span><span><strong>學習統計</strong><small>掌握進度與測驗表現</small></span><span class="nav-arrow">›</span></button>
    </nav>

    <section id="app" class="content-panel" aria-live="polite">
      <div class="loading">正在準備學習內容…</div>
    </section>
    <footer><span>單字學習中心 2.0</span><span>本機學習紀錄不會自動同步到其他裝置</span></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
